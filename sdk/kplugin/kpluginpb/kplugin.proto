// The provider plugin protocol (ADR 0003), shaped like CSI: gRPC over a unix socket in
// /run/kevaso-plugins/NAME/plugin.sock. A plugin serves Identity, plus the services for what it
// provides; the others answer UNIMPLEMENTED. Every call is idempotent and keyed by an ID the
// control plane picks.
//
// Errors are gRPC status codes, as CSI uses them: NOT_FOUND (it isn't there: deleting it is done),
// UNIMPLEMENTED (not served), FAILED_PRECONDITION (someone else's: a DNS record set with another
// owner, a volume attached elsewhere), ABORTED (still in progress: call again later).
//
// Generate with `make proto` in kevaso.com/core.
syntax = "proto3";

package kevaso.plugin.v1;

option go_package = "kevaso.com/core/sdk/kplugin/kpluginpb";

// ── Identity ─────────────────────────────────────────────────────────────────

service Identity {
  rpc GetPluginInfo(GetPluginInfoRequest) returns (PluginInfo);
}

message GetPluginInfoRequest {}

message PluginInfo {
  string name = 1;     // e.g. linode
  string version = 2;
  string protocol = 3; // kevaso.plugin/v1
  bool hosts = 4;      // it recognises its own machines (Hosts service)
  repeated Class load_balancers = 5;
  repeated Class storage = 6;
  repeated string dns = 7; // DNS provider names
}

message Class {
  string name = 1;
  string description = 2;
  bool own_hosts_only = 3; // only the plugin's machines can use it
  bool announce = 4;       // load balancers: the silo's host announces the address
  bool node_ports = 5;     // load balancers: the host gets a node port per service port
  string topology = 6;     // storage: host | zone | region | global (where it can attach from)
  string reach = 7;        // storage: device (attached, the host mounts it; the default) | mount (the node side mounts it)
  bool filters_sources = 8; // load balancers not announced: it accepts only Port.allow_from's client sources
  bool reserve = 9;         // load balancers: it holds an address apart from a load balancer (Addresses)
  string follows = 10;      // load balancers: where an address goes with its silo: host | region (default) | global
  bool sends_from = 11;     // load balancers: the address is on the silo's host, so the silo can send from it
}

// ── Hosts ────────────────────────────────────────────────────────────────────

service Hosts {
  rpc DescribeHosts(DescribeHostsRequest) returns (DescribeHostsResponse);
}

message Host {
  string name = 1;
  string address = 2;
}

message HostInfo {
  string name = 1;
  string id = 2;     // the provider's ID for the machine
  string region = 3;
  string private_address = 4;
}

message DescribeHostsRequest { repeated Host hosts = 1; }
message DescribeHostsResponse { repeated HostInfo hosts = 1; }

// ── Load balancers ───────────────────────────────────────────────────────────

service LoadBalancers {
  rpc EnsureLoadBalancer(LoadBalancer) returns (LoadBalancerStatus);
  rpc DeleteLoadBalancer(LoadBalancerRef) returns (DeleteLoadBalancerResponse);
}

message Port {
  string name = 1;
  string protocol = 2; // TCP | UDP
  int32 port = 3;
  int32 node_port = 4;
  // where clients may connect from (CIDRs); empty: anywhere. Only sent to classes that filter sources.
  repeated string allow_from = 5;
}

message LoadBalancer {
  string class = 1;
  string id = 2; // the UID of the IP object it serves
  string namespace = 3;
  string name = 4;
  string address = 5; // the IP's reserved address, for classes that reserve
  repeated Port ports = 6;
  repeated HostInfo backends = 7; // the silo's host
  repeated HostInfo hosts = 8;    // every host of the plugin's
}

message LoadBalancerStatus {
  string address = 1;
  repeated string source_ranges = 2; // where it connects to node ports from
}

message LoadBalancerRef {
  string class = 1;
  string id = 2;
  string address = 3;
}

message DeleteLoadBalancerResponse {}

// ── Addresses ────────────────────────────────────────────────────────────────

// Addresses: an address held apart from any load balancer, for one IP object (classes with
// reserve). For a class without it, ReleaseAddress deletes the load balancer keyed by the IP.

service Addresses {
  rpc ReserveAddress(AddressReservation) returns (AddressStatus);
  rpc ReleaseAddress(AddressRef) returns (ReleaseAddressResponse);
}

message AddressReservation {
  string class = 1;
  string id = 2; // the IP's UID
  string namespace = 3;
  string name = 4;
  string region = 5;
  string address = 6; // one you already own; empty: any
}

message AddressStatus {
  string address = 1;
  string region = 2;
  string handle = 3;
}

message AddressRef {
  string class = 1;
  string id = 2;
  string address = 3;
  string handle = 4;
}

message ReleaseAddressResponse {}

// ── Volumes ──────────────────────────────────────────────────────────────────

service Volumes {
  rpc EnsureVolume(Volume) returns (VolumeStatus);
  rpc AttachVolume(Attachment) returns (AttachmentStatus);
  rpc DetachVolume(Attachment) returns (DetachVolumeResponse);
  rpc DeleteVolume(VolumeRef) returns (DeleteVolumeResponse);
}

message Volume {
  string class = 1;
  string id = 2;   // the silo's UID and the volume's name
  string name = 3; // a label on the provider's side
  int64 size_bytes = 4;
  string region = 5;
}

message VolumeStatus {
  string handle = 1;
  string region = 2;
  int64 size_bytes = 3;
  // size_enforced: the volume can't grow past size_bytes (a block device's size, a directory
  // quota). A mount class that can't enforce it says false.
  bool size_enforced = 4;
}

message Attachment {
  string class = 1;
  string handle = 2;
  HostInfo host = 3;
}

message AttachmentStatus { string device = 1; }
message DetachVolumeResponse {}

message VolumeRef {
  string class = 1;
  string handle = 2;
}

message DeleteVolumeResponse {}

// ── Node ─────────────────────────────────────────────────────────────────────

// Node is a plugin's node side, on a worker: its own socket, /run/kevaso-plugins/NAME/node.sock,
// serving Identity (the storage classes it mounts) and Node. The worker's kevasod calls it for
// storage classes with reach "mount": the node side mounts the volume at the path kevasod gives
// (credentials stay in the plugin), and unmounts it when the silo leaves the host.

service Node {
  rpc NodeMountVolume(NodeMount) returns (NodeMountResponse);
  rpc NodeUnmountVolume(NodeMount) returns (NodeUnmountResponse);
}

message NodeMount {
  string class = 1;
  string handle = 2; // from EnsureVolume
  string id = 3;     // the silo's UID and the volume's name
  string path = 4;   // where on the host: kevasod made the parent, the plugin makes the rest
}

message NodeMountResponse {}
message NodeUnmountResponse {}

// ── DNS ──────────────────────────────────────────────────────────────────────

service DNS {
  rpc EnsureRecord(Record) returns (EnsureRecordResponse);
  rpc DeleteRecord(Record) returns (DeleteRecordResponse);
}

message Record {
  string provider = 1;
  string name = 2; // fully qualified, no trailing dot
  string type = 3; // A | AAAA | TXT
  repeated string values = 4;
  int32 ttl = 5;
  string owner = 6; // a plugin never changes a record set someone else owns
}

message EnsureRecordResponse {}
message DeleteRecordResponse {}
