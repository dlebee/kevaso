# Cloudflare Worker that answers `go get kevaso.com/...` (see vanity.js).
name = "kevaso-vanity"
main = "vanity.js"
compatibility_date = "2026-11-01"
workers_dev = false

# The Worker only sees module paths; the rest of kevaso.com is the public website (Worker `kevaso-www`,
# its own private repo, route kevaso.com/*; the most specific route wins). One route per MODULES entry,
# `<root>*`: an exact `kevaso.com/core` does not match `/core?go-get=1`, the request `go` actually
# sends. `core*` also catches site paths like `/core-concepts`: those go back to the site through the
# SITE binding (a test checks this list matches MODULES).
routes = [
  { pattern = "kevaso.com/core*", zone_name = "kevaso.com" },
  { pattern = "kevaso.com/provider-linode*", zone_name = "kevaso.com" },
]

services = [{ binding = "SITE", service = "kevaso-www" }]
