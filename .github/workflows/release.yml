name: release

# Pushing a tag like v0.3.0 builds, signs and publishes release v0.3.0. Nothing else releases.
# Signing and notarizing skip themselves until their secrets and variables exist, so an unsigned
# release still works. `make release-dry` builds and packages the same files locally, unsigned.
on:
  push:
    tags: ['v*']

# Read-only by default; only the Windows job can mint an Azure OIDC token and only publish can write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not a version like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          # Only commits already on main are released: a tag pushed on an unreviewed branch is refused.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"; exit 1
          fi
          # The version keeps its leading v: kevasod reports it that way and kvoadm upgrade expects it.
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          [[ "$TAG" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - run: make vet race

  macos:
    name: macOS (sign + notarize)
    runs-on: macos-latest
    needs: [version, test]
    environment: release # signing secrets live in this environment, readable only by release jobs
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      AC_TEAM_ID: ${{ vars.AC_TEAM_ID }}
      # Only says whether signing is configured; the secret itself is passed to the steps that use it.
      SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      NOTARIZING: ${{ secrets.AC_APPLE_ID != '' && secrets.AC_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}

      - name: Build kvo and kvoadm (arm64, amd64), and kevasod for a Mac worker (arm64)
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do hack/release/build.sh "$VERSION" darwin "$arch" "build/darwin-$arch"; done

      - name: Import Developer ID certificate into a temporary keychain
        if: env.SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Only codesign may use the key without a prompt.
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          existing=()
          while IFS= read -r k; do
            k="${k#"${k%%[![:space:]]*}"}"; k="${k#\"}"; k="${k%\"}"
            [ -n "$k" ] && existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" ${existing[@]+"${existing[@]}"}
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Codesign the binaries (hardened runtime)
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          for f in build/darwin-*/*; do
            codesign --force --timestamp --options runtime --identifier "com.kevaso.$(basename "$f")" \
              --sign "$MACOS_SIGNING_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done

      - name: Package zips
        run: hack/release/package.sh "$VERSION" build dist

      # A bare Mach-O binary cannot carry a stapled ticket: Apple notarizes the zip's contents and
      # Gatekeeper finds the ticket online the first time a binary runs.
      - name: Notarize the zips
        if: env.SIGNING == 'true' && env.NOTARIZING == 'true'
        env:
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_APP_PASSWORD: ${{ secrets.AC_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for zip in dist/*.zip; do
            out="$(xcrun notarytool submit "$zip" --apple-id "$AC_APPLE_ID" --password "$AC_APP_PASSWORD" \
              --team-id "$AC_TEAM_ID" --wait --timeout 30m --output-format json)"
            echo "$out"
            id="$(jq -r .id <<<"$out")"; status="$(jq -r .status <<<"$out")"
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$id" --apple-id "$AC_APPLE_ID" --password "$AC_APP_PASSWORD" --team-id "$AC_TEAM_ID" || true
              echo "::error::notarization of $zip ended $status"; exit 1
            fi
          done

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: macos, path: dist/*, if-no-files-found: error}

  windows:
    name: Windows (Trusted Signing)
    runs-on: windows-latest
    needs: [version, test]
    environment: release # the Azure federated credential trusts this environment
    permissions:
      contents: read
      id-token: write # Azure OIDC for Trusted Signing
    env:
      VERSION: ${{ needs.version.outputs.version }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}

      - name: Build kvo and kvoadm (amd64)
        shell: bash
        run: hack/release/build.sh "$VERSION" windows amd64 build/windows-amd64

      - name: Azure login (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install SignTool and the Trusted Signing dlib
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'microsoft.artifactsigning.client'; $ver = '1.0.128'
          $out = Join-Path $env:RUNNER_TEMP 'acs'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $zip = Join-Path $out 'client.zip'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$pkg/$ver/$pkg.$ver.nupkg" -OutFile $zip
          # Pinned: this DLL is loaded into signtool while the Azure signing token is live.
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '74BD7D27E6CE1051409C38D9B46BC8DF0400ECD643D51FFBF2AC00869061E40B') { throw 'Trusted Signing client hash mismatch' }
          Expand-Archive $zip -DestinationPath (Join-Path $out 'pkg') -Force
          $dlib = Get-ChildItem (Join-Path $out 'pkg') -Filter Azure.CodeSigning.Dlib.dll -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dlib) { throw 'Azure.CodeSigning.Dlib.dll (x64) not found' }
          $meta = Join-Path $out 'metadata.json'
          @{ Endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT.TrimEnd('/'); CodeSigningAccountName = $env:AZURE_TRUSTED_SIGNING_ACCOUNT;
             CertificateProfileName = $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE } | ConvertTo-Json | Set-Content $meta -Encoding utf8
          $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          "ACS_DLIB=$dlib", "ACS_METADATA=$meta", "SIGNTOOL=$signtool" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign kvo.exe and kvoadm.exe
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          foreach ($f in 'kvo.exe', 'kvoadm.exe') { & ./hack/release/sign-windows.ps1 "build/windows-amd64/$f" }

      - name: Package zips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($prog in 'kvo', 'kvoadm') {
            $name = "$prog-$env:VERSION-windows-amd64"
            New-Item -ItemType Directory -Force -Path "stage/$name" | Out-Null
            Copy-Item "build/windows-amd64/$prog.exe", LICENSE, NOTICE, README.md "stage/$name/"
            Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: windows, path: dist/*, if-no-files-found: error}

  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: [version, test]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - name: Build kvo, kvoadm and kevasod (amd64, arm64)
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do hack/release/build.sh "$VERSION" linux "$arch" "build/linux-$arch"; done
          got="$(build/linux-amd64/kevasod version)"
          [ "$got" = "$VERSION" ] || { echo "::error::kevasod version says $got, the tag is $VERSION"; exit 1; }
      - name: Package
        run: hack/release/package.sh "$VERSION" build dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: linux, path: dist/*, if-no-files-found: error}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, macos, windows, linux]
    permissions:
      contents: write # create the release and upload its files
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {path: dist, merge-multiple: true}
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          cat > notes.md <<EOF
          ## Downloads

          \`kvo\` is the command line for using a cluster, \`kvoadm\` the one for running it, and
          \`kevasod\` the daemon on each host: Linux workers and system nodes, and Mac workers (Apple silicon).

          | File | What |
          | --- | --- |
          | \`kvo-$VERSION-darwin-arm64.zip\`, \`kvoadm-$VERSION-darwin-arm64.zip\` | macOS, Apple silicon: signed with a Developer ID and notarized |
          | \`kvo-$VERSION-darwin-amd64.zip\`, \`kvoadm-$VERSION-darwin-amd64.zip\` | macOS, Intel: signed with a Developer ID and notarized |
          | \`kvo-$VERSION-windows-amd64.zip\`, \`kvoadm-$VERSION-windows-amd64.zip\` | Windows x64: signed with Trusted Signing |
          | \`kvo-$VERSION-linux-amd64.tar.gz\`, \`kvoadm-$VERSION-linux-amd64.tar.gz\` | Linux x86-64, unsigned |
          | \`kvo-$VERSION-linux-arm64.tar.gz\`, \`kvoadm-$VERSION-linux-arm64.tar.gz\` | Linux arm64, unsigned |
          | \`kevasod-$VERSION-linux-amd64.tar.gz\`, \`kevasod-$VERSION-linux-arm64.tar.gz\` | the host daemon for Linux (Ubuntu 24.04 and 26.04, Debian 12), unsigned |
          | \`kevasod-$VERSION-darwin-arm64.zip\` | the host daemon for a Mac worker (macOS 26, Apple silicon; the \`tart\` runtime): signed with a Developer ID and notarized |
          | \`SHA256SUMS\` | SHA-256 of every file above: \`sha256sum -c SHA256SUMS --ignore-missing\` |

          The macOS zips were notarized by Apple, but a plain command-line binary cannot have its
          notarization ticket stapled to it. When a downloaded binary first runs, Gatekeeper looks the
          ticket up with Apple online, so that first run needs a network connection.

          EOF
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Kevaso ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
