name: nightly
# What is too slow or too random for every push: the fuzzers (the push workflow runs only their
# seed corpus), the property, stress and election tests three times over under the race detector,
# and the mutation run that proves the safety guards cannot be removed with every test green.
on:
  schedule: [{ cron: "30 3 * * *" }]
  workflow_dispatch:
permissions: { contents: read }

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make fuzz FUZZTIME=60s

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make stress

  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: every mutation still matches its code
        run: go run ./hack/mutate -check   # fails naming the stale entries, before the hour-long run
      - run: make mutate

  contention:                   # load-dependent tests show up here, not on a merge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make contention
