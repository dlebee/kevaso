# Rendered by Kevaso's nginx ingress driver for class public: rewritten on every change.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log notice;
events {
    worker_connections 1024;
}
http {
    access_log /var/log/nginx/access.log;
    server_tokens off;
    keepalive_timeout 65s;
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 60s;
    client_max_body_size 16m;
    server_names_hash_bucket_size 128;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # WebSocket: pass Upgrade through, keep-alive otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    # The client's address, for the backend.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ingress:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Any other host: ACME challenges, else nothing.
    server {
        listen 80 default_server;
        server_name _;
        location = /.well-known/acme-challenge/tok-123_abc {
            default_type text/plain;
            return 200 "tok-123_abc.thumbprint-XYZ";
        }
        location ^~ /.well-known/acme-challenge/ {
            return 404;
        }
        location / {
            return 404;
        }
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }
    server {
        listen 80;
        server_name api.example.com;
        location = /.well-known/acme-challenge/tok-123_abc {
            default_type text/plain;
            return 200 "tok-123_abc.thumbprint-XYZ";
        }
        location ^~ /.well-known/acme-challenge/ {
            return 404;
        }
        location /ws {
            return 308 https://$host$request_uri;
        }
        location / {
            return 308 https://$host$request_uri;
        }
    }
    server {
        listen 443 ssl;
        server_name api.example.com;
        # ingress payments/api
        ssl_certificate /etc/nginx/ingress/4e9c0aea20ce4bb6.pem;
        ssl_certificate_key /etc/nginx/ingress/4e9c0aea20ce4bb6.pem;
        # -
        # ingress payments/api
        location /ws {
            client_max_body_size 10m;
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_pass http://10.64.0.5:9000;
        }
        # -
        # ingress payments/api
        location / {
            client_max_body_size 10m;
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_pass http://10.64.0.4:8080;
        }
        # -
    }
    server {
        listen 80;
        server_name pending.example.com;
        location = /.well-known/acme-challenge/tok-123_abc {
            default_type text/plain;
            return 200 "tok-123_abc.thumbprint-XYZ";
        }
        location ^~ /.well-known/acme-challenge/ {
            return 404;
        }
        location / {
            return 308 https://$host$request_uri;
        }
    }
    server {
        listen 80;
        server_name plain.example.com;
        location = /.well-known/acme-challenge/tok-123_abc {
            default_type text/plain;
            return 200 "tok-123_abc.thumbprint-XYZ";
        }
        location ^~ /.well-known/acme-challenge/ {
            return 404;
        }
        # ingress shop/plain
        location / {
            proxy_pass http://10.64.0.6:3000;
        }
        # -
    }
}
