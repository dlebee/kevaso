<script>

(async()=>{
await T('window.open-no-gesture',()=>String(window.open('__C__/t05/open-no-gesture')));

  try{R('window.open-with-gesture',String(window.open('__C__/t05/open-gesture')))}catch(e){R('window.open-with-gesture','blocked '+e)}

});

})();
