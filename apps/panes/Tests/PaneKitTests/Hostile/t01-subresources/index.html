<!doctype html><html><head><meta charset="utf-8">
<script>
window.__report=[];
const R=(k,v)=>window.__report.push(k+': '+v);
const T=async(k,f)=>{try{const v=await f();R(k,'ok '+String(v).slice(0,80))}catch(e){R(k,'blocked '+(e&&e.name)+' '+String(e&&e.message).slice(0,80))}};
document.addEventListener('securitypolicyviolation',e=>R('csp',e.effectiveDirective+' '+e.blockedURI.slice(0,60)));
</script>

(async()=>{
await T('fetch',()=>fetch('__C__/t01/fetch').then(r=>r.status));

await T('fetch-no-cors',()=>fetch('__C__/t01/fetch-nocors',{mode:'no-cors'}).then(r=>r.type));
await T('xhr',()=>new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('GET','__C__/t01/xhr');x.onload=()=>ok(x.status);x.onerror=()=>no(new Error('xhr error'));x.send()}));
await T('sendBeacon',()=>navigator.sendBeacon('__C__/t01/beacon','x'));
await T('new-Image',()=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok('loaded');i.onerror=()=>no(new Error('img error'));i.src='__C__/t01/new-image'}));
await T('dynamic-import',()=>import('__C__/t01/dyn-import.js'));
await T('worker',()=>{const w=new Worker(URL.createObjectURL(new Blob(["fetch('__C__/t01/worker-fetch')"])));return 'created'});
await T('service-worker',()=>navigator.serviceWorker?navigator.serviceWorker.register('/sw.js'):'no serviceWorker API');
await T('blob-url-img',()=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok('blob ok (local only)');i.onerror=()=>no(new Error('blob img error'));i.src=URL.createObjectURL(new Blob(['<svg xmlns="http://www.w3.org/2000/svg"/>'],{type:'image/svg+xml'}))}));
R('done','t01');
})();
